[SystemSettings]
; Strand hair hangs this preview engine's renderer at the first frame, in a window and off screen alike,
; and simulated hair flies apart without it. Hair is drawn as cards that do not move until that is fixed upstream.
r.HairStrands.Strands=0
r.HairStrands.Simulation=0

; Every body's skin is drawn from the streamed-texture pool, which as the engine sets it is 64 MB: with sixty people in
; Block Square that is a fraction of what they ask for. On 24 November, after the game had stood in the square for an hour
; and a half, one woman's bare arms were bright green. I could not make it happen again, so this is a guess at the cause,
; not a proven cure: the pool is made four times the size and allowed to grow.
r.VT.PoolSizeScale=4
r.VT.PoolAutoGrow=1
